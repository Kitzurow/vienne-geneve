<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De Vienne à Genève</title>
<style>
  :root {
    color-scheme: dark;
    --paper: #f4efe6;
    --dim: rgba(244, 239, 230, .72);
    --line: rgba(244, 239, 230, .28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070707; color: var(--paper); }
  body {
    font-family: "Palatino Linotype", Palatino, Georgia, serif;
    overflow: hidden;
  }
  button, input { font: inherit; color: inherit; }
  button {
    background: transparent;
    border: 0;
    cursor: pointer;
    padding: 0;
  }
  #stage { position: fixed; inset: 0; background: #070707; }
  .layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .7s ease;
  }
  .layer.on { opacity: 1; }
  .layer.portrait, .layer.full {
    object-fit: contain;
    background: #070707;
    animation: none;
    transform: none;
  }
  .layer.still {
    animation: none;
    transform: none;
  }
  .kb0 { animation: kb0 9s ease-out forwards; }
  .kb1 { animation: kb1 9s ease-out forwards; }
  .kb2 { animation: kb2 9s ease-out forwards; }
  .kb3 { animation: kb3 9s ease-out forwards; }
  @keyframes kb0 { from { transform: scale(1.06); transform-origin: 30% 35%; } to { transform: scale(1.16); transform-origin: 30% 35%; } }
  @keyframes kb1 { from { transform: scale(1.06); transform-origin: 70% 40%; } to { transform: scale(1.16); transform-origin: 70% 40%; } }
  @keyframes kb2 { from { transform: scale(1.08); transform-origin: 50% 80%; } to { transform: scale(1.18); transform-origin: 50% 80%; } }
  @keyframes kb3 { from { transform: scale(1.05); transform-origin: 40% 20%; } to { transform: scale(1.14); transform-origin: 40% 20%; } }
  @media (prefers-reduced-motion: reduce) {
    .kb0, .kb1, .kb2, .kb3 { animation: none; }
  }
  #vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 160px 40px rgba(0, 0, 0, .45);
    z-index: 2;
  }
  #chapter {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .8s ease;
  }
  #chapter.show { opacity: 1; }
  #chapter .card {
    padding: 1.1rem 1.5rem 1.25rem;
    background: rgba(0, 0, 0, .48);
  }
  #chapter .date {
    font-family: "Segoe UI", sans-serif;
    font-size: .78rem;
    letter-spacing: .42em;
    text-transform: uppercase;
    text-indent: .42em;
    color: var(--paper);
  }
  #chapter .place {
    margin: .45rem 0 0;
    font-size: clamp(2.4rem, 6vw, 5.2rem);
    font-weight: normal;
    letter-spacing: -.02em;
    line-height: .95;
  }
  #art-badge {
    position: absolute;
    left: 1.15rem;
    bottom: 5.5rem;
    z-index: 4;
    max-width: min(26rem, calc(100% - 2.4rem));
    padding: .55rem .85rem .62rem;
    background: rgba(0, 0, 0, .55);
    backdrop-filter: blur(10px);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .5s ease, transform .5s ease;
    pointer-events: none;
  }
  #art-badge.show { opacity: 1; transform: none; }
  #art-badge strong {
    display: block;
    font-weight: normal;
    font-size: clamp(.98rem, 1.7vw, 1.18rem);
    line-height: 1.25;
    letter-spacing: .01em;
  }
  #art-badge span {
    display: block;
    margin-top: .22rem;
    font-family: "Segoe UI", sans-serif;
    font-size: .68rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--dim);
  }
  #art-badge span:empty { display: none; }
  #caption {
    position: absolute;
    left: 50%;
    bottom: 5.2rem;
    transform: translateX(-50%);
    z-index: 4;
    width: min(38rem, calc(100% - 3rem));
    margin: 0;
    padding: .85rem 1.1rem;
    background: rgba(0, 0, 0, .5);
    font-size: 1.02rem;
    line-height: 1.45;
    text-align: center;
    display: none;
  }
  body.text #caption { display: block; }
  #end {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, .55);
    text-align: center;
  }
  #end.show { display: flex; }
  #end h2 {
    margin: 0;
    font-size: clamp(2.8rem, 7vw, 6rem);
    font-weight: normal;
  }
  #end p {
    margin: .8rem 0 0;
    font-family: "Segoe UI", sans-serif;
    letter-spacing: .28em;
    text-transform: uppercase;
    font-size: .78rem;
    color: var(--dim);
  }
  #cover {
    position: absolute;
    inset: 0;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    background: rgba(0, 0, 0, .46);
  }
  #cover.gone { display: none; }
  #cover .kicker {
    font-family: "Segoe UI", sans-serif;
    letter-spacing: .46em;
    text-transform: uppercase;
    font-size: .78rem;
    text-indent: .46em;
  }
  #cover h1 {
    margin: .7rem 0 0;
    font-size: clamp(3rem, 8vw, 7rem);
    font-weight: normal;
    letter-spacing: -.03em;
    line-height: .92;
  }
  #cover .note {
    max-width: 28rem;
    margin: 1.4rem 0 0;
    font-family: "Segoe UI", sans-serif;
    font-size: .92rem;
    line-height: 1.45;
    color: var(--dim);
  }
  #start {
    margin-top: 2rem;
    padding: .85rem 1.6rem;
    border: 1px solid var(--paper);
    letter-spacing: .18em;
    text-transform: uppercase;
    font-family: "Segoe UI", sans-serif;
    font-size: .78rem;
  }
  #start:hover { background: var(--paper); color: #111; }
  #bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 7;
    display: flex;
    align-items: center;
    gap: .8rem;
    padding: .85rem 1.1rem 1rem;
    background: linear-gradient(transparent, rgba(0,0,0,.72));
    font-family: "Segoe UI", sans-serif;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease;
  }
  body.started #bar { pointer-events: auto; }
  body.ui #bar, body.paused #bar { opacity: 1; }
  #cover ~ #bar { display: none; }
  #play {
    width: 2.4rem;
    height: 2.4rem;
    border: 1px solid var(--line);
    border-radius: 50%;
    font-size: .85rem;
    flex: none;
  }
  #where {
    flex: none;
    min-width: 11rem;
    font-size: .82rem;
    letter-spacing: .04em;
    white-space: nowrap;
  }
  #where small { display: block; color: var(--dim); letter-spacing: .16em; text-transform: uppercase; font-size: .68rem; }
  #scrub { flex: 1; accent-color: var(--paper); min-width: 4rem; }
  #count, .toggle, #tempo {
    flex: none;
    font-size: .75rem;
    letter-spacing: .08em;
    color: var(--dim);
  }
  .toggle.on, #tempo { color: var(--paper); }
  #days {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 8;
    width: min(22rem, 100%);
    margin: 0;
    padding: 1.2rem 1rem 5rem;
    list-style: none;
    background: rgba(8, 8, 8, .92);
    overflow: auto;
    transform: translateX(100%);
    transition: transform .35s ease;
  }
  #days.open { transform: none; }
  #days button {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    width: 100%;
    text-align: left;
    padding: .55rem .4rem;
    border-bottom: 1px solid rgba(244, 239, 230, .12);
    font-family: Georgia, serif;
    font-size: 1.05rem;
  }
  #days button.now { color: #fff; }
  #days .d {
    font-family: "Segoe UI", sans-serif;
    font-size: .72rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--dim);
    padding-top: .25rem;
  }
  #jump {
    position: absolute;
    top: 1rem;
    right: 1rem;
    z-index: 9;
    font-family: "Segoe UI", sans-serif;
    font-size: .75rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    border: 1px solid var(--line);
    padding: .45rem .7rem;
    background: rgba(0, 0, 0, .35);
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease;
  }
  body.started #jump { pointer-events: auto; }
  body.ui #jump, body.paused #jump, #days.open ~ #jump { opacity: 1; }
</style>
</head>
<body>
<div id="stage">
  <img id="picA" class="layer" alt="">
  <img id="picB" class="layer" alt="">
  <video id="clip" class="layer" playsinline></video>
  <div id="vignette"></div>
  <div id="chapter"><div class="card"><div class="date"></div><h2 class="place"></h2></div></div>
  <div id="art-badge"><strong></strong><span></span></div>
  <p id="caption"></p>
  <div id="end"><h2>Merci à tous</h2><p>Vienne — Genève</p></div>
  <div id="cover">
    <div class="kicker">Juin 2026</div>
    <h1>De Vienne<br>à Genève</h1>
    <p class="note">Les photos défilent. Une voix raconte la journée, puis se tait. Le texte peut rester caché.</p>
    <button id="start" type="button" disabled>Chargement…</button>
  </div>
</div>
<button id="jump" type="button">Jours</button>
<ul id="days"></ul>
<div id="bar">
  <button id="play" type="button" aria-label="Lecture">▶</button>
  <div id="where"><small id="when"></small><span id="place"></span></div>
  <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Position">
  <span id="count"></span>
  <button id="tempo" type="button">1×</button>
  <button id="voiceBtn" class="toggle on" type="button">Voix</button>
  <button id="textBtn" class="toggle" type="button">Texte</button>
</div>
<script>
const picA = document.getElementById("picA");
const picB = document.getElementById("picB");
const clip = document.getElementById("clip");
const chapterEl = document.getElementById("chapter");
const caption = document.getElementById("caption");
const artBadge = document.getElementById("art-badge");
const artTitle = artBadge.querySelector("strong");
const artNote = artBadge.querySelector("span");
const cover = document.getElementById("cover");
const endEl = document.getElementById("end");
const playBtn = document.getElementById("play");
const whenEl = document.getElementById("when");
const placeEl = document.getElementById("place");
const scrub = document.getElementById("scrub");
const countEl = document.getElementById("count");
const tempoBtn = document.getElementById("tempo");
const voiceBtn = document.getElementById("voiceBtn");
const textBtn = document.getElementById("textBtn");
const daysEl = document.getElementById("days");
const jumpBtn = document.getElementById("jump");

const speeds = [1, 1.5, 2];
let speedIndex = 0;
let story = null;
let flat = [];
let index = 0;
let playing = false;
let voiceOn = true;
let front = 0;
let timer = 0;
let chapterToken = 0;
let showToken = 0;
let hideUi = 0;
const voice = new Audio();
const aside = new Audio();
const music = new Audio();
const beds = {
  city: ["media/musique/golden-1.mp3", "media/musique/golden-2.mp3", "media/musique/golden-3.mp3", "media/musique/golden-4.mp3"],
  road: ["media/musique/hills-1.mp3", "media/musique/hills-2.mp3", "media/musique/hills-3.mp3", "media/musique/hills-4.mp3", "media/musique/hills-5.mp3", "media/musique/hills-6.mp3"],
};
let musicGroup = "";
const musicCursor = { city: 0, road: 0 };
music.preload = "auto";
music.volume = 0;
const pics = [picA, picB];
const cache = new Map();

function speed() { return speeds[speedIndex]; }

function musicBed(dayIndex) {
  return story.days[dayIndex].id <= "20260606" ? "city" : "road";
}

function someoneTalks() {
  const voiceTalks = voiceOn && !!voice.src && !voice.paused && !voice.ended;
  const asideTalks = voiceOn && !!aside.src && !aside.paused && !aside.ended;
  const clipTalks = clip.classList.contains("on") && !clip.paused && !clip.ended;
  return voiceTalks || asideTalks || clipTalks;
}

function setMusic(dayIndex) {
  const group = musicBed(dayIndex);
  if (group === musicGroup && music.src) {
    if (playing && music.paused) music.play().catch(() => {});
    return;
  }
  musicGroup = group;
  const list = beds[group];
  const at = musicCursor[group] % list.length;
  musicCursor[group] = at + 1;
  music.volume = Math.min(music.volume, 0.04);
  music.src = list[at];
  if (playing) music.play().catch(() => {});
}

music.addEventListener("ended", () => {
  if (!musicGroup || !playing) return;
  const list = beds[musicGroup];
  const at = musicCursor[musicGroup] % list.length;
  musicCursor[musicGroup] = at + 1;
  music.src = list[at];
  music.play().catch(() => {});
});

setInterval(() => {
  const open = playing && cover.classList.contains("gone") && !endEl.classList.contains("show");
  const goal = open ? (someoneTalks() ? 0.12 : 0.34) : 0;
  const step = music.volume < goal ? 0.018 : 0.028;
  music.volume = Math.abs(music.volume - goal) <= step ? goal : music.volume + Math.sign(goal - music.volume) * step;
  if (goal === 0 && music.volume === 0 && !music.paused) music.pause();
  if (goal > 0 && playing && music.paused && music.src) music.play().catch(() => {});
}, 140);

function warm(i) {
  const item = flat[i];
  if (!item || item.type !== "image" || cache.has(item.src)) return;
  const image = new Image();
  image.src = item.src;
  cache.set(item.src, image);
}

function showChapter(day) {
  chapterEl.querySelector(".date").textContent = day.date;
  chapterEl.querySelector(".place").textContent = day.place;
  chapterEl.classList.add("show");
  const token = ++chapterToken;
  setTimeout(() => {
    if (token === chapterToken) chapterEl.classList.remove("show");
  }, 4200);
}

function startVoice(day) {
  voice.pause();
  if (!voiceOn) return;
  voice.src = day.audio;
  voice.playbackRate = speed();
  voice.play().catch(() => {});
  voice.onloadedmetadata = () => stretch(flat[index] ? flat[index].day : 0);
}

function stretch(dayIndex) {
  const images = flat.filter((item) => item.day === dayIndex && item.type === "image");
  if (!images.length || !Number.isFinite(voice.duration)) return;
  const sum = images.reduce((total, item) => total + item.ms, 0);
  const need = voice.duration * 1000 + 700;
  if (need <= sum) return;
  const extra = (need - sum) / images.length;
  images.forEach((item) => { item.hold = item.ms + extra; });
}

function journalAlive() {
  if (!voiceOn || !voice.src) return false;
  if (!Number.isFinite(voice.duration) || voice.duration === 0) return true;
  return !voice.ended && voice.currentTime < voice.duration - 0.35;
}

function schedule() {
  clearTimeout(timer);
  if (!playing) return;
  const item = flat[index];
  if (!item || item.type === "video") return;
  let ms = (item.hold || item.ms) / speed();
  const next = flat[index + 1];
  const last = !next || next.day !== item.day;
  if (last && voiceOn && voice.duration && !voice.paused && !voice.ended) {
    const remain = (voice.duration - voice.currentTime) * 1000 / speed();
    if (remain > ms) ms = remain + 350;
  }
  if (voiceOn && aside.src && !aside.paused && !aside.ended && Number.isFinite(aside.duration)) {
    const remain = (aside.duration - aside.currentTime) * 1000 / speed();
    if (remain + 450 > ms) ms = remain + 450;
  }
  timer = setTimeout(() => go(index + 1), ms);
}

function speakLabel(item) {
  aside.onloadedmetadata = null;
  if (!voiceOn || journalAlive()) {
    aside.pause();
    return;
  }
  if (!item || !item.say) {
    aside.pause();
    return;
  }
  const previous = flat[index - 1];
  if (previous && previous.label === item.label && (previous.note || "") === (item.note || "")) return;
  if (aside.src.endsWith(item.say) && !aside.paused && !aside.ended) return;
  aside.pause();
  aside.src = item.say;
  aside.playbackRate = speed();
  aside.onloadedmetadata = () => {
    if (playing && flat[index] === item) schedule();
  };
  aside.play().catch(() => {});
}

function showBadge(item) {
  if (!item || !item.label) {
    artBadge.classList.remove("show");
    return;
  }
  artTitle.textContent = item.label;
  artNote.textContent = item.note || "";
  artBadge.classList.add("show");
}

function showImage(item) {
  const token = ++showToken;
  artBadge.classList.remove("show");
  clip.pause();
  clip.classList.remove("on");
  const back = 1 - front;
  const incoming = pics[back];
  const outgoing = pics[front];
  const reveal = () => {
    if (token !== showToken) return;
    const portrait = incoming.naturalHeight > incoming.naturalWidth;
    const framed = item.fit === "contain" || portrait;
    incoming.className = framed ? "layer on full" : (item.label ? "layer on still" : "layer on kb" + (index % 4));
    incoming.alt = item.label || "";
    outgoing.classList.remove("on");
    front = back;
    showBadge(item);
    speakLabel(item);
    schedule();
  };
  if (incoming.getAttribute("src") === item.src && incoming.complete && incoming.naturalWidth) {
    reveal();
    return;
  }
  incoming.onload = reveal;
  incoming.src = item.src;
}

function showVideo(item) {
  showBadge(null);
  aside.pause();
  pics[front].classList.remove("on");
  if (voiceOn) voice.pause();
  clip.className = "layer on";
  clip.playbackRate = speed();
  clip.src = item.src;
  clip.play().catch(() => go(index + 1));
}

clip.addEventListener("loadedmetadata", () => {
  clip.classList.toggle("portrait", clip.videoHeight > clip.videoWidth);
});

function go(nextIndex) {
  if (!story) return;
  clearTimeout(timer);
  if (nextIndex >= flat.length) {
    playing = false;
    clearTimeout(timer);
    showBadge(null);
    voice.pause();
    aside.pause();
    clip.pause();
    endEl.classList.add("show");
    playBtn.textContent = "▶";
    document.body.classList.add("paused");
    return;
  }
  if (nextIndex < 0) nextIndex = 0;
  endEl.classList.remove("show");
  const item = flat[nextIndex];
  const entered = !flat[index] || flat[index].day !== item.day || nextIndex === index;
  index = nextIndex;
  const day = story.days[item.day];
  whenEl.textContent = day.date;
  placeEl.textContent = day.place;
  caption.textContent = day.voice;
  countEl.textContent = (index + 1) + " / " + flat.length;
  scrub.value = String(index);
  [...daysEl.children].forEach((li, dayIndex) => {
    li.firstChild.classList.toggle("now", dayIndex === item.day);
  });
  warm(index + 1);
  warm(index + 2);
  warm(index + 3);
  if (entered) {
    showChapter(day);
    flat.forEach((media) => {
      if (media.day === item.day) delete media.hold;
    });
    startVoice(day);
  }
  setMusic(item.day);
  if (item.type === "video") showVideo(item);
  else showImage(item);
}

function setPlaying(value) {
  playing = value;
  playBtn.textContent = playing ? "❚❚" : "▶";
  document.body.classList.toggle("paused", !playing);
  voice.playbackRate = speed();
  aside.playbackRate = speed();
  clip.playbackRate = speed();
  if (!playing) {
    clearTimeout(timer);
    voice.pause();
    aside.pause();
    clip.pause();
    return;
  }
  const item = flat[index];
  if (!item) return;
  if (item.type === "video") clip.play().catch(() => {});
  else {
    if (voiceOn && journalAlive()) voice.play().catch(() => {});
    else if (voiceOn && aside.src && aside.currentTime < (aside.duration || 0) - 0.15) aside.play().catch(() => {});
    schedule();
  }
}

clip.addEventListener("ended", () => {
  if (voiceOn && voice.currentTime > 0 && voice.currentTime < (voice.duration || 0) - 0.2) {
    voice.play().catch(() => {});
  }
  if (playing) go(index + 1);
});

playBtn.addEventListener("click", () => setPlaying(!playing));
tempoBtn.addEventListener("click", () => {
  speedIndex = (speedIndex + 1) % speeds.length;
  tempoBtn.textContent = String(speeds[speedIndex]).replace(".", ",") + "×";
  voice.playbackRate = speed();
  aside.playbackRate = speed();
  clip.playbackRate = speed();
  if (playing) schedule();
});
voice.addEventListener("ended", () => {
  const item = flat[index];
  if (!playing || !item || item.type !== "image" || journalAlive()) return;
  speakLabel(item);
  schedule();
});
voiceBtn.addEventListener("click", () => {
  voiceOn = !voiceOn;
  voiceBtn.classList.toggle("on", voiceOn);
  if (!voiceOn) {
    voice.pause();
    aside.pause();
  } else if (playing && flat[index] && flat[index].type !== "video") {
    startVoice(story.days[flat[index].day]);
  }
});
textBtn.addEventListener("click", () => {
  document.body.classList.toggle("text");
  textBtn.classList.toggle("on", document.body.classList.contains("text"));
});
function arm() {
  playing = true;
  playBtn.textContent = "❚❚";
  document.body.classList.remove("paused");
  document.body.classList.add("started");
}
scrub.addEventListener("change", () => {
  arm();
  go(Number(scrub.value));
});
jumpBtn.addEventListener("click", () => daysEl.classList.toggle("open"));

document.addEventListener("keydown", (event) => {
  if (cover && !cover.classList.contains("gone") && event.key !== "Enter") return;
  if (event.key === " ") {
    event.preventDefault();
    setPlaying(!playing);
  } else if (event.key === "ArrowRight") {
    arm();
    go(index + 1);
  } else if (event.key === "ArrowLeft") {
    arm();
    go(index - 1);
  } else if (event.key === "ArrowDown") {
    const day = flat[index] ? flat[index].day : 0;
    const jump = flat.findIndex((item) => item.day === day + 1);
    if (jump >= 0) { arm(); go(jump); }
  } else if (event.key === "ArrowUp") {
    const day = flat[index] ? flat[index].day : 0;
    const jump = flat.findIndex((item) => item.day === Math.max(0, day - 1));
    if (jump >= 0) { arm(); go(jump); }
  }
});

function pokeUi() {
  document.body.classList.add("ui");
  clearTimeout(hideUi);
  hideUi = setTimeout(() => document.body.classList.remove("ui"), 2200);
}
document.addEventListener("mousemove", pokeUi);
document.addEventListener("touchstart", pokeUi, { passive: true });

document.getElementById("stage").addEventListener("click", (event) => {
  if (event.target.closest("#cover, #bar, #days, #jump")) return;
  if (!cover.classList.contains("gone")) return;
  setPlaying(!playing);
});

fetch("story.json", { cache: "no-store" })
  .then((response) => response.json())
  .then((data) => {
    story = data;
    data.days.forEach((day, dayIndex) => {
      day.media.forEach((item) => flat.push({ ...item, day: dayIndex }));
      const li = document.createElement("li");
      const button = document.createElement("button");
      button.type = "button";
      button.innerHTML = "<span></span><span class='d'></span>";
      button.querySelector("span").textContent = day.place;
      button.querySelector(".d").textContent = day.date;
      button.addEventListener("click", () => {
        const jump = flat.findIndex((item) => item.day === dayIndex);
        daysEl.classList.remove("open");
        arm();
        go(jump);
      });
      li.appendChild(button);
      daysEl.appendChild(li);
    });
    scrub.max = String(Math.max(0, flat.length - 1));
    const first = flat.find((item) => item.type === "image");
    if (first) {
      picA.src = first.src;
      picA.classList.add("on");
    }
    const start = document.getElementById("start");
    start.disabled = false;
    start.textContent = "Commencer";
  });

document.getElementById("start").addEventListener("click", () => {
  if (!story) return;
  cover.classList.add("gone");
  document.body.classList.add("started", "ui");
  playing = true;
  playBtn.textContent = "❚❚";
  go(0);
});
</script>
</body>
</html>
